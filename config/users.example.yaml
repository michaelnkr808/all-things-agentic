# Schema: agentic.server.auth (provisional)
#
# Generate a hash line:
#   python scripts/hash_password.py            # prompts securely
#
# A user's role MUST exist under 'roles' in config/permissions.yaml —
# login fails closed otherwise. The authenticated role becomes the run's
# principal for every permission gate; it is never taken from request
# bodies or model output.
#
