# Canonical users config template (provisional — Malik). Copy and edit.
#   cp config/users.example.yaml config/users.yaml
#
# Schema: agentic.server.auth (provisional)
#
# Generate a hash line:
#   python scripts/hash_password.py            # prompts securely
#
# A user's role MUST exist under 'roles' in config/permissions.yaml —
# login fails closed otherwise. The authenticated role becomes the run's
# principal for every permission gate; it is never taken from request
# bodies or model output.
#
# No example passwords ship in this file. Generate your own hashes.
#
# `demo_password` is OPTIONAL plaintext consumed only by GET /api/demo-mode,
# which serves it ONLY when AGENTIC_DEMO_MODE=1. Omit it unless you are
# running a local demo; never commit a real users.yaml.

users:
  alice:
    role: analyst
    password_hash: <run scripts/hash_password.py>
    # demo_password: only-if-local-demo
  root:
    role: admin
    password_hash: <run scripts/hash_password.py>
    # demo_password: only-if-local-demo
